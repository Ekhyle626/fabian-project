<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact - BrightTech Solutions</title>
  <link rel="stylesheet" href="../css/style.css">
</head>
<body>

<header>
  <div class="logo">BrightTech.</div>
  <nav>
    <a href="../index.html">Home</a>
    <a href="about.html">About</a>
    <a href="services.html">Services</a>
    <a href="gallery.html">Gallery</a>
    <a href="contact.html" class="active">Contact</a>
  </nav>
</header>

<section class="hero">
  <span class="hero-badge">💬 Get In Touch</span>
  <h1>Let's Build Something New</h1>
  <p>Have a project in mind or need assistance? Drop us a message below!</p>
</section>

<section class="content-section">
  <div class="contact-container">
    <form id="contactForm" class="contact-form">
      <div class="input-group">
        <label>Your Name</label>
        <input type="text" placeholder="e.g. Alex Morgan" required>
      </div>
      
      <div class="input-group">
        <label>Your Email</label>
        <input type="email" placeholder="alex@example.com" required>
      </div>

      <div class="input-group">
        <label>Message</label>
        <textarea rows="5" placeholder="Tell us about your idea..." required></textarea>
      </div>

      <button type="submit" class="cta-btn">Send Message</button>
    </form>
  </div>
</section>

<footer>
  <p>© 2026 BrightTech Solutions. All Rights Reserved.</p>
</footer>

<script src="../js/script.js"></script>
</body>
</html>
